{% macro weather_icon(kind) %}
<svg class="weather-icon weather-icon-{{ kind }}" viewBox="0 0 48 48" aria-hidden="true">
{% if kind == 'sun' %}
<circle cx="24" cy="24" r="9"/><path d="M24 3v6m0 30v6M3 24h6m30 0h6M9 9l4 4m22 22 4 4M9 39l4-4m22-22 4-4"/>
{% elif kind == 'moon' %}
<path d="M33 6a19 19 0 1 0 9 29A18 18 0 0 1 33 6Z"/>
{% elif kind == 'unknown' %}
<circle cx="24" cy="24" r="17"/><path d="M19 18a5 5 0 1 1 7 5c-2 1-2 3-2 4m0 6h.01"/>
{% else %}
{% if kind == 'partly-cloudy' %}<circle cx="17" cy="16" r="7"/><path d="M17 3v3M4 16h3M7 6l3 3m17-3-3 3"/>{% endif %}
<path d="M12 33a8 8 0 0 1-1-16 12 12 0 0 1 23 3 7 7 0 1 1 3 13Z"/>
{% if kind == 'rain' %}<path d="m15 38-2 5m12-5-2 5m12-5-2 5"/>
{% elif kind == 'snow' %}<path d="M15 38v7m-3-5 6 3m0-3-6 3M33 38v7m-3-5 6 3m0-3-6 3"/>
{% elif kind == 'storm' %}<path d="m25 32-6 8h7l-4 7"/>
{% elif kind == 'fog' %}<path d="M8 39h32M13 45h22"/>{% endif %}
{% endif %}
</svg>
{% endmacro %}
