name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts server.py
      - run: ruff format --check app tests scripts server.py
      - run: python -m unittest discover -s tests -v
      - run: node --check app/static/app.js && node --check app/static/map.js
